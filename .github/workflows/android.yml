name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Опубликовать релиз с APK'
        type: boolean
        default: false
      version:
        description: 'Версия релиза (тег)'
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Сборка APK (Gradle + Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk anakopia-gradle.apk
      - uses: actions/upload-artifact@v4
        with:
          name: anakopia-apk
          path: anakopia-gradle.apk

  emulator:
    name: Запуск в эмуляторе Android
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: anakopia-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and play
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: emu/

  release:
    name: Публикация релиза
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [build, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: anakopia-apk
      - name: Prepare release file
        run: cp dist/anakopia.apk Anakopia.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Анакопиа ${{ inputs.version || github.ref_name }}
          make_latest: true
          files: Anakopia.apk
          body: |
            **Анакопиа** — мобильная игра о защите крепости Анакопиа (Android 7.0+).

            Как установить на телефон:
            1. Откройте эту страницу в браузере на телефоне и нажмите **Anakopia.apk** ниже.
            2. Когда файл скачается, нажмите «Открыть» — Android предложит **установить** приложение.
            3. Если появится запрос — разрешите браузеру установку неизвестных приложений.

            Если старая версия уже стоит и установка не идёт — удалите её и поставьте заново.
